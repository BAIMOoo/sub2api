name: Codex HTTP alignment

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-http-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Coalesce pushes for five minutes
        if: github.event_name == 'push'
        run: sleep 300
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install capture test dependencies
        run: python -m pip install -r tools/codex_alignment/requirements.txt
      - name: Probe privacy, capture, queue and notification contracts
        run: python -m unittest discover -s tools/codex_alignment -p 'test_*.py' -v
      - name: Observer race and privacy checks
        working-directory: backend
        run: go test -race ./internal/pkg/codexprobe
      - name: HTTP request and abnormal-path regressions
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/pkg/tlsfingerprint ./internal/repository
          ./internal/service ./internal/server/middleware
          -run 'Codex|Zstd|Compact|OpenAI.*(Retry|Failover|Timeout|401|429|5xx)|HTTPUpstream.*(Disconnect|Timeout)|Alignment' -count=1
      - name: Record immutable provenance
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('alignment-provenance.json').write_text(json.dumps({
              'source_sha': os.environ['SOURCE_SHA'], 'run_id': os.environ['RUN_ID'],
              'scope': 'offline_http_contracts', 'live_provider_tested': False,
              'approved_body_fixture_version': '0.158.0'}))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alignment-provenance
          path: alignment-provenance.json
          retention-days: 30
